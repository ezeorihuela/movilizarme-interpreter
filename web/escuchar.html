<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escuchar interpretación · MovilizarMe</title>
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  #captions { margin-top: 1rem; max-width: 42rem; margin-left: auto; margin-right: auto; }
  #cap-prev { font-size: clamp(1.05rem, 4.2vw, 1.4rem); line-height: 1.4; opacity: .45; margin: 0 0 .7rem; }
  #cap-tran { font-size: clamp(2.2rem, 9vw, 3.6rem); line-height: 1.25; font-weight: 700; margin: 0 0 .5rem; }
  #cap-tran.interim { opacity: .55; }
  #cap-orig { font-size: clamp(1.2rem, 5vw, 1.6rem); line-height: 1.4; opacity: .7; margin: 0; }
  #cap-orig.interim { opacity: .4; }
  /* En vivo la pantalla es para leer: fuera textos largos y título grande. */
  body.live h1 { font-size: 1.45rem; margin: .3rem 0; }
  body.live .brand { font-size: .95rem; margin-bottom: .1rem; }
  body.live #t-intro, body.live #t-tip { display: none; }
  /* Botón redondo de play/stop: lo más intuitivo para cualquier edad. */
  .playbtn { width: 6.4rem; height: 6.4rem; border-radius: 50%; border: 0; background: var(--verde); color: #fff; font-size: 2.5rem; cursor: pointer; line-height: 1; padding-left: .45rem; box-shadow: 0 4px 16px rgba(23,97,95,.35); }
  .playbtn[disabled] { opacity: .5; }
  .playbtn.stop { background: #fff; color: var(--morado); box-shadow: inset 0 0 0 .18rem var(--morado); padding-left: 0; font-size: 2.1rem; }
  .playlbl { font-weight: 700; color: var(--morado-oscuro); font-size: 1.15rem; margin: .1rem 0 0; }
  .langsel { position: absolute; top: .8rem; right: 1rem; font-family: "Fira Sans", sans-serif; font-size: .85rem; color: var(--suave); }
  .langsel button { background: none; border: 0; padding: .15rem .2rem; font: inherit; color: inherit; cursor: pointer; }
  .langsel button.on { color: var(--morado-oscuro); font-weight: 700; text-decoration: underline; }
</style>
</head>
<body>
<div class="langsel"><button type="button" id="lang-es">ES</button>|<button type="button" id="lang-en">EN</button></div>
<main class="wrap center">
  <p class="brand" id="t-brand">MovilizarMe · Interpretación en vivo</p>
  <h1 id="t-title">Escucha la interpretación</h1>
  <p id="t-intro">Escribe el código de sala que se ve en la pantalla y toca Escuchar.</p>

  <div id="step-code">
    <p><input type="text" id="room" maxlength="6" autocomplete="off" autocapitalize="characters" aria-label="Código de sala"></p>
    <p><button class="playbtn" id="btn-listen" type="button" aria-label="Escuchar">▶</button></p>
    <p class="playlbl" id="t-listen-lbl">Escuchar</p>
  </div>

  <p class="status" id="status" role="status"></p>
  <div id="step-live" hidden>
    <p><span class="pulse on"></span><strong id="t-live">Estás escuchando en vivo</strong></p>
    <div id="captions" hidden aria-live="polite">
      <p id="cap-prev"></p>
      <p id="cap-tran"></p>
      <p id="cap-orig"></p>
    </div>
    <p><button class="playbtn stop" id="btn-stop" type="button" aria-label="Detener">■</button></p>
    <p class="playlbl" id="t-stop-lbl">Detener</p>
  </div>
  <details id="diag" style="margin-top:1.2rem;text-align:left;max-width:42rem;margin-left:auto;margin-right:auto">
    <summary style="cursor:pointer;font-weight:600" id="t-diag">Diagnóstico de audio</summary>
    <p class="status" id="diag-body" style="white-space:pre-line"></p>
  </details>
  <p class="status" id="t-tip">Usa audífonos para escuchar mejor. Puedes bloquear tu teléfono; el audio sigue.</p>
</main>
<script>
(function () {
  // Idioma: primero la elección guardada (la misma clave que usa el sitio
  // movilizar.me), luego el idioma del dispositivo; español por defecto.
  var STR = {
    es: {
      docTitle: 'Escuchar interpretación · MovilizarMe',
      't-brand': 'MovilizarMe · Interpretación en vivo',
      't-title': 'Escucha la interpretación',
      't-intro': 'Escribe el código de sala que se ve en la pantalla y toca Escuchar.',
      't-listen-lbl': 'Escuchar',
      't-live': 'Estás escuchando en vivo',
      't-stop-lbl': 'Detener',
      't-tip': 'Usa audífonos para escuchar mejor. Puedes bloquear tu teléfono; el audio sigue.',
      't-diag': 'Diagnóstico de audio',
      roomLabel: 'Código de sala', listenLabel: 'Escuchar', stopLabel: 'Detener',
      connecting: 'Conectando…',
      waiting: 'Conectado. Esperando a que el intérprete comience…',
      needCode: 'Escribe el código de sala de 6 letras.',
      badRoom: 'No se encontró esa sala. Revisa el código en la pantalla.',
      failed: 'No se pudo conectar. Inténtalo de nuevo.',
      dConn: 'Conexión: ', dNoRoom: 'sin sala',
      dTracks: 'Pistas de audio recibidas: ',
      dTrack: 'Pista ', dMuted: 'silenciada por el emisor', dActive: 'activa', dLevel: ' · Nivel: '
    },
    en: {
      docTitle: 'Listen to the interpretation · MovilizarMe',
      't-brand': 'MovilizarMe · Live interpretation',
      't-title': 'Listen to the interpretation',
      't-intro': 'Type the room code shown on the screen and tap Listen.',
      't-listen-lbl': 'Listen',
      't-live': 'You are listening live',
      't-stop-lbl': 'Stop',
      't-tip': 'Headphones work best. You can lock your phone; the audio keeps playing.',
      't-diag': 'Audio diagnostics',
      roomLabel: 'Room code', listenLabel: 'Listen', stopLabel: 'Stop',
      connecting: 'Connecting…',
      waiting: 'Connected. Waiting for the interpreter to start…',
      needCode: 'Type the 6-letter room code.',
      badRoom: 'That room was not found. Check the code on the screen.',
      failed: 'Could not connect. Try again.',
      dConn: 'Connection: ', dNoRoom: 'no room',
      dTracks: 'Audio tracks received: ',
      dTrack: 'Track ', dMuted: 'muted by the sender', dActive: 'active', dLevel: ' · Level: '
    }
  };
  var LANG = (function () {
    try {
      var saved = localStorage.getItem('mm-lang');
      if (saved === 'es' || saved === 'en') return saved;
    } catch (e) {}
    return (navigator.language || 'es').toLowerCase().indexOf('en') === 0 ? 'en' : 'es';
  })();
  var msg = STR[LANG];
  function setLang(l) {
    LANG = l; msg = STR[l];
    try { localStorage.setItem('mm-lang', l); } catch (e) {}
    document.documentElement.lang = l;
    document.title = msg.docTitle;
    ['t-brand', 't-title', 't-intro', 't-listen-lbl', 't-live', 't-stop-lbl', 't-tip', 't-diag'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.textContent = msg[id];
    });
    var roomInput = document.getElementById('room');
    if (roomInput) roomInput.setAttribute('aria-label', msg.roomLabel);
    var bl = document.getElementById('btn-listen');
    if (bl) bl.setAttribute('aria-label', msg.listenLabel);
    var bs = document.getElementById('btn-stop');
    if (bs) bs.setAttribute('aria-label', msg.stopLabel);
    document.getElementById('lang-es').className = l === 'es' ? 'on' : '';
    document.getElementById('lang-en').className = l === 'en' ? 'on' : '';
    if (typeof updateDiag === 'function') updateDiag();
  }
  var status = document.getElementById('status');
  var input = document.getElementById('room');
  var params = new URLSearchParams(location.search);
  if (params.get('room')) input.value = params.get('room').toUpperCase();

  var room = null;
  var isLive = false;
  // Diagnóstico: por cada pista recibida, si el emisor la tiene silenciada
  // y cuánto nivel de sonido trae de verdad.
  var diagCtx = null, diagTracks = [], diagTimer = null;
  function makeMeter(stream) {
    try {
      if (!diagCtx) { var AC = window.AudioContext || window.webkitAudioContext; diagCtx = new AC(); }
      if (diagCtx.state === 'suspended') diagCtx.resume();
      var srcNode = diagCtx.createMediaStreamSource(stream);
      var an = diagCtx.createAnalyser(); an.fftSize = 256;
      srcNode.connect(an);
      var data = new Uint8Array(an.frequencyBinCount);
      return function () {
        an.getByteTimeDomainData(data);
        var peak = 0;
        for (var i = 0; i < data.length; i++) { var v = Math.abs(data[i] - 128) / 128; if (v > peak) peak = v; }
        return Math.round(peak * 100);
      };
    } catch (e) { return function () { return -1; }; }
  }
  function updateDiag() {
    var det = document.getElementById('diag');
    var el = document.getElementById('diag-body');
    if (!el || !det || !det.open) return;
    var lines = [msg.dConn + (room ? room.state : msg.dNoRoom), msg.dTracks + diagTracks.length];
    diagTracks.forEach(function (d, i) {
      lines.push(msg.dTrack + (i + 1) + ': ' + (d.track.isMuted ? msg.dMuted : msg.dActive) + msg.dLevel + d.meter() + '%');
    });
    el.textContent = lines.join('\n');
  }
  // ¿Dos textos son casi el mismo? Azure a veces cierra la misma frase dos
  // veces con una palabra distinta; sin este filtro la anterior y la nueva
  // se veían duplicadas en pantalla.
  function parecido(a, b) {
    function norm(s) { return (s || '').toLowerCase().replace(/[^a-záéíóúñü0-9 ]/gi, '').replace(/\s+/g, ' ').trim(); }
    var x = norm(a), y = norm(b);
    if (!x || !y) return false;
    if (x === y || x.indexOf(y) >= 0 || y.indexOf(x) >= 0) return true;
    var xs = x.split(' '), ys = y.split(' ');
    var setY = {};
    ys.forEach(function (w) { setY[w] = 1; });
    var common = xs.filter(function (w) { return setY[w]; }).length;
    return common / Math.max(xs.length, ys.length) >= 0.75;
  }
  function setStatus(text, isError) {
    status.textContent = text || '';
    status.className = 'status' + (isError ? ' error' : '');
  }

  document.getElementById('lang-es').addEventListener('click', function () { setLang('es'); });
  document.getElementById('lang-en').addEventListener('click', function () { setLang('en'); });
  setLang(LANG);

  document.getElementById('btn-listen').addEventListener('click', async function () {
    var code = input.value.trim().toUpperCase();
    if (code.length !== 6) { setStatus(msg.needCode, true); return; }
    var btn = this;
    btn.disabled = true;
    if (!diagCtx) { try { diagCtx = new (window.AudioContext || window.webkitAudioContext)(); diagCtx.resume(); } catch (e) {} }
    setStatus(msg.connecting);
    try {
      var res = await fetch(window.MM.api + '/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room: code, role: 'listener' })
      });
      if (!res.ok) throw new Error(res.status === 404 ? 'room' : 'server');
      var data = await res.json();
      if (data.title) {
        document.getElementById('t-title').textContent = data.title;
        document.title = data.title + ' · MovilizarMe';
      }
      room = new LivekitClient.Room({ adaptiveStream: false });
      room.on('trackSubscribed', function (track) {
        if (track.kind === 'audio') {
          track.attach();
          try { diagTracks.push({ track: track, meter: makeMeter(new MediaStream([track.mediaStreamTrack])) }); } catch (e) {}
          if (!diagTimer) diagTimer = setInterval(updateDiag, 500);
          isLive = true;
          document.getElementById('step-code').hidden = true;
          document.getElementById('step-live').hidden = false;
          document.body.classList.add('live');
          setStatus('');
        }
      });
      room.on('dataReceived', function (payload) {
        try {
          var d = JSON.parse(new TextDecoder().decode(payload));
          if (!d || d.t !== 'cap') return;
          var box = document.getElementById('captions');
          var trEl = document.getElementById('cap-tran');
          var orEl = document.getElementById('cap-orig');
          if (d.f && d.tr && trEl.textContent && d.tr !== trEl.textContent && !parecido(trEl.textContent, d.tr)) {
            document.getElementById('cap-prev').textContent = trEl.textContent;
          }
          if (d.tr) trEl.textContent = d.tr;
          if (d.o) orEl.textContent = d.o;
          trEl.className = d.f ? '' : 'interim';
          orEl.className = d.f ? '' : 'interim';
          box.hidden = false;
        } catch (err) {}
      });
      room.on('disconnected', function () { stop(); });
      await room.connect(data.url, data.token);
      // Si el intérprete ya estaba transmitiendo, trackSubscribed llegó
      // durante la conexión y el aviso de espera ya no aplica.
      if (!isLive) setStatus(msg.waiting);
    } catch (e) {
      setStatus(e.message === 'room' ? msg.badRoom : msg.failed, true);
      btn.disabled = false;
    }
  });

  function stop() {
    isLive = false;
    diagTracks = [];
    if (room) { room.disconnect(); room = null; }
    document.getElementById('step-code').hidden = false;
    document.getElementById('step-live').hidden = true;
    document.getElementById('captions').hidden = true;
    document.body.classList.remove('live');
    document.getElementById('btn-listen').disabled = false;
  }
  document.getElementById('btn-stop').addEventListener('click', stop);
})();
</script>
</body>
</html>
