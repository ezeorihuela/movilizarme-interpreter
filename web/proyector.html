<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala de interpretación · MovilizarMe</title>
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="qrcode.min.js"></script>
</head>
<body>
<main class="projector">
  <div>
    <h1>Interpretación en vivo<br>Live Interpretation</h1>
    <p>Escanea con tu teléfono · Scan with your phone</p>
    <p class="qr" id="qr"></p>
    <p style="margin-bottom:0">o entra a <strong>movilizar.me/escuchar</strong> con el código · or go to <strong>movilizar.me/escuchar</strong> with the code</p>
    <p class="code" id="code">------</p>
  </div>
</main>
<script>
(function () {
  var code = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  document.getElementById('code').textContent = code || '------';
  if (code) {
    var url = window.MM.listenBase + '?room=' + code;
    var qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  }
})();
</script>
</body>
</html>
